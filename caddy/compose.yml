services:
  caddy:
    build: .
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "shamu.network.orcachill.in:100.114.66.30"
      - "orkid.network.orcachill.in:100.114.67.239"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config:/etc/caddy
      - ./resources:/var/www
      - /var/lib/infisical-agent/rendered/caddy:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
