version = "2"
bindaddress = "127.0.0.1:7070"
adminbindpath = "/data/db/kanidmd.sock"
db_path = "/data/db/kanidm.db"
tls_chain = "/data/pki/chain.pem"
tls_key = "/data/pki/key.pem"
domain = "auth.orcachill.in"
origin = "https://auth.orcachill.in"
log_level = "info"

[http_client_address_info]
x-forward-for = ["127.0.0.1", "::1"]

[online_backup]
path = "/data/backups/"
schedule = "17 2 * * *"
versions = 14
