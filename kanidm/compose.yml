services:
  kanidm:
    image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
    container_name: kanidm
    restart: always
    network_mode: host
    user: "982:982"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ./server.toml:/data/server.toml:ro
      - /var/lib/kanidm/db:/data/db
      - /var/lib/kanidm/backups:/data/backups
      - /var/lib/kanidm/pki:/data/pki:ro
